<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Olivier Lüthy">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c26"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb877"/>
      <stop offset="0.55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ef6f1c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.45" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cockpit tile with a framed HUD border -->
  <rect x="0" y="0" width="32" height="32" rx="7.5" fill="url(#tile)"/>
  <rect x="1.6" y="1.6" width="28.8" height="28.8" rx="6" fill="none" stroke="#ff8a3d" stroke-opacity="0.32" stroke-width="1"/>

  <!-- OL monogram: the O reads as the reticle aperture -->
  <g filter="url(#glow)">
    <circle cx="11.6" cy="16" r="5.5" fill="none" stroke="url(#amber)" stroke-width="3"/>
    <path d="M22 9.2V22.8H26.4" fill="none" stroke="url(#amber)" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
</svg>
